[package]
name = "perfectpixel"
version = "0.3.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "Deterministic local raster, sprite, vector, and motion asset compiler."
repository = "https://github.com/AxiomOrient/perfectpixel"
homepage = "https://github.com/AxiomOrient/perfectpixel"
documentation = "https://docs.rs/perfectpixel"
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "perfectpixel"
path = "src/bin/perfectpixel.rs"

[[bin]]
name = "perfectpixel-mcp"
path = "src/bin/perfectpixel-mcp.rs"

[dependencies]
base64 = "0.22"
binpack2d = "=1.0.1"
fast_image_resize = "=6.1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
resvg = { version = "0.47", default-features = false, features = ["raster-images", "text", "system-fonts"] }
rmcp = { version = "3.1.4", features = ["server", "transport-io"] }
roxmltree = "=0.21.1"
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svgtypes = "=0.16.1"
thiserror = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "signal", "sync"] }
